<!DOCTYPE html>
<html lang="es" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Página no encontrada · Laura.dev</title>
    <script>
        (function () {
            var t = 'dark';
            try {
                var s = localStorage.getItem('tema');
                if (s === 'light' || s === 'dark') t = s;
                else if (window.matchMedia('(prefers-color-scheme: light)').matches) t = 'light';
            } catch (e) { }
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Fira+Sans:wght@400;600;700&family=Orbitron:wght@800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/Portfolio/css/styles.css">
    <link rel="icon" href="/Portfolio/img/favicon.svg" type="image/svg+xml">
    <style>
        .not-found {
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            gap: 22px;
            padding-block: 64px;
        }

        .not-found__code {
            font-family: var(--font-display);
            font-size: clamp(4rem, 14vw, 8rem);
            font-weight: 800;
            line-height: 1;
            color: var(--cyan);
        }

        .not-found p {
            max-width: 520px;
            font-size: 1.125rem;
            color: var(--text-muted);
        }
    </style>
</head>

<body>
    <main class="container not-found">
        <p class="section-kicker"><span>&gt; error</span></p>
        <h1 class="not-found__code">404</h1>
        <p>Esta página no existe o se ha movido. Puedes volver al inicio o ir directamente a ver mis proyectos.</p>
        <div class="hero__actions">
            <a class="btn btn--primary" href="/Portfolio/">Volver al inicio</a>
            <a class="btn btn--secondary" href="/Portfolio/#proyectos">Ver proyectos</a>
        </div>
    </main>
</body>

</html>
